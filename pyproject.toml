[project]
name = "pharos-rpg-server"
version = "0.1.0"
description = "Backend server for a real-time RPG, built with FastAPI and WebSockets."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.128.0",
    "mcp>=1.27",
    "pydantic-settings>=2.0.0",
    "redis>=7.1.0",
    "uvicorn[standard]>=0.40.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]

