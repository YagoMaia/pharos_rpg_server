services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pharos-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CAMPAIGN_DB_PATH=/data/pharos.sqlite3
      # MCP de preparação: único Host liberado pelo transporte. Deixar vazio
      # desliga o endpoint /mcp sem precisar de mudança de código.
      - MCP_ALLOWED_HOSTS=pharos-server.yagomaia.com.br
    volumes:
      - pharos_sqlite_data:/data
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pharos-network

  redis:
    image: redis:7-alpine
    container_name: pharos-redis
    restart: unless-stopped
    volumes:
      - pharos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pharos-network

volumes:
  pharos_sqlite_data:
    name: pharos_sqlite_data
  pharos_redis_data:
    name: pharos_redis_data

networks:
  pharos-network:
    name: pharos-network
