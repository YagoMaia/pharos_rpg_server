<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>RPG Combat Test</title>
    <style>
      body {
        font-family: sans-serif;
        padding: 20px;
        background-color: #f0f2f5;
      }
      .container {
        display: flex;
        gap: 20px;
      }
      .panel {
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        flex: 1;
      }

      .char-card {
        border: 1px solid #ddd;
        padding: 10px;
        margin-bottom: 10px;
        border-radius: 5px;
      }
      .active-turn {
        border: 2px solid #2ecc71;
        background-color: #e8f8f5;
      }
      .dead {
        opacity: 0.6;
        background-color: #fab1a0;
      }

      .log-box {
        height: 200px;
        overflow-y: scroll;
        background: #333;
        color: #fff;
        padding: 10px;
        font-family: monospace;
      }

      input,
      button {
        padding: 8px;
        margin: 5px 0;
      }
      button {
        cursor: pointer;
        background-color: #3498db;
        color: white;
        border: none;
        border-radius: 4px;
      }
      button:hover {
        background-color: #2980b9;
      }
      button.attack-btn {
        background-color: #e74c3c;
      }

      #connection-status {
        font-weight: bold;
        color: orange;
      }
    </style>
  </head>
  <body>
    <h1>RPG WebSocket Arena</h1>

    <div id="login-area" class="panel">
      <h3>Entrar na Sessão</h3>
      <input
        type="text"
        id="sessionId"
        value="session_01"
        placeholder="ID da Sessão"
      />
      <input type="text" id="charId" placeholder="Seu ID (ex: player1)" />
      <button onclick="connect()">Conectar</button>
      <button onclick="createBattle()" style="background-color: #2ecc71">
        [ADMIN] Criar Batalha
      </button>
    </div>

    <div id="game-area" class="container" style="display: none">
      <div class="panel">
        <h3>Combate</h3>
        <div id="characters-list"></div>
      </div>

      <div class="panel">
        <h3>Painel de Controle (<span id="my-char-display"></span>)</h3>
        <div id="connection-status">Desconectado</div>
        <hr />

        <div id="actions-panel" style="display: none">
          <h4>Sua vez!</h4>
          <select id="target-select"></select>
          <input type="number" id="dmg-input" value="5" placeholder="Dano" />
          <button class="attack-btn" onclick="sendAction('attack')">
            Atacar
          </button>
          <button onclick="sendAction('end_turn')">Passar Turno</button>
        </div>
        <div id="wait-message" style="color: gray">Aguardando seu turno...</div>

        <h4>Logs de Batalha</h4>
        <div id="logs" class="log-box"></div>
      </div>
    </div>

    <script>
      let ws;
      let myCharId = "";
      let currentSession = "";

      // 1. Inicializa a batalha no backend (Função de Admin/Mestre)
      async function createBattle() {
        const session = document.getElementById("sessionId").value;
        await fetch(`http://localhost:8000/create-battle/${session}`, {
          method: "POST",
        });
        alert("Batalha criada! Agora conecte-se.");
      }

      // 2. Conecta no WebSocket
      function connect() {
        currentSession = document.getElementById("sessionId").value;
        myCharId = document.getElementById("charId").value;

        if (!myCharId) return alert("Digite seu ID de personagem!");

        // URL do WebSocket
        ws = new WebSocket(
          `ws://localhost:8000/ws/${currentSession}/${myCharId}`
        );

        ws.onopen = () => {
          document.getElementById("login-area").style.display = "none";
          document.getElementById("game-area").style.display = "flex";
          document.getElementById("connection-status").innerText = "Conectado";
          document.getElementById("connection-status").style.color = "green";
          document.getElementById("my-char-display").innerText = myCharId;
        };

        ws.onmessage = (event) => {
          const state = JSON.parse(event.data);
          if (state.error) {
            alert(state.error);
          } else {
            renderGame(state);
          }
        };

        ws.onclose = () => {
          document.getElementById("connection-status").innerText =
            "Desconectado";
          document.getElementById("connection-status").style.color = "red";
        };
      }

      // 3. Renderiza a tela baseada no JSON do Backend
      function renderGame(state) {
        const list = document.getElementById("characters-list");
        const select = document.getElementById("target-select");
        const logs = document.getElementById("logs");

        list.innerHTML = "";
        select.innerHTML = "";

        // Atualiza Logs
        logs.innerHTML = state.logs.map((l) => `<div>> ${l}</div>`).join("");
        logs.scrollTop = logs.scrollHeight; // Auto-scroll

        // Identifica de quem é a vez
        const activeCharId = state.turn_order[state.turn_index];
        const isMyTurn = activeCharId === myCharId;

        // Controla visibilidade dos botões
        document.getElementById("actions-panel").style.display = isMyTurn
          ? "block"
          : "none";
        document.getElementById("wait-message").style.display = isMyTurn
          ? "none"
          : "block";

        // Renderiza Personagens
        state.turn_order.forEach((id) => {
          const char = state.entities[id];
          const isActive = id === activeCharId;
          const isDead = char.hp <= 0;

          // HTML do Card
          const card = document.createElement("div");
          card.className = `char-card ${isActive ? "active-turn" : ""} ${
            isDead ? "dead" : ""
          }`;
          card.innerHTML = `
                <strong>${char.name}</strong> (${char.type}) <br>
                HP: ${char.hp} / ${char.max_hp}
                ${isActive ? "🔴 <b>(TURNO ATUAL)</b>" : ""}
                ${isDead ? "💀 <b>(MORTO)</b>" : ""}
            `;
          list.appendChild(card);

          // Popula o select de alvos (não pode atacar a si mesmo)
          if (id !== myCharId && !isDead) {
            const option = document.createElement("option");
            option.value = id;
            option.innerText = char.name;
            select.appendChild(option);
          }
        });
      }

      // 4. Envia Ação para o Backend
      function sendAction(type) {
        const payload = {
          action: type,
        };

        if (type === "attack") {
          payload.target_id = document.getElementById("target-select").value;
          payload.damage_amount = parseInt(
            document.getElementById("dmg-input").value
          );
        }

        ws.send(JSON.stringify(payload));
      }
    </script>
  </body>
</html>
